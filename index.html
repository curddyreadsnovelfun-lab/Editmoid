<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Cut — Browser Video Editor</title>
<link rel="stylesheet" href="style.css">
<base target="_blank">
</head>
<body>

<header id="topbar">
  <div class="tb-group brand">
    <span class="logo">✦</span>
    <input id="projName" value="Untitled Project" spellcheck="false" title="Project name">
  </div>
  <div class="tb-group">
    <button id="newBtn" class="tbtn" title="New project">New</button>
    <button id="saveBtn" class="tbtn" title="Save project">Save</button>
    <button id="projectsBtn" class="tbtn" title="Load project">Projects</button>
  </div>
  <div class="tb-group">
    <button id="undoBtn" class="tbtn" title="Undo (Ctrl+Z)">↶</button>
    <button id="redoBtn" class="tbtn" title="Redo (Ctrl+Y)">↷</button>
  </div>
  <div class="tb-group">
    <button id="addTextBtn" class="tbtn" title="Add text overlay">T+</button>
    <button id="shapeRect" class="tbtn" title="Rectangle shape">▭</button>
    <button id="shapeRound" class="tbtn" title="Rounded rectangle">▢</button>
    <button id="shapeCircle" class="tbtn" title="Ellipse shape">◯</button>
    <button id="shapeTri" class="tbtn" title="Polygon shape">⬡</button>
  </div>
  <div class="tb-group grow"></div>
  <div class="tb-group">
    <button id="leftToggle" class="tbtn only-mobile" title="Toggle library">☰</button>
    <button id="themeBtn" class="tbtn" title="Toggle theme">☾</button>
    <button id="exportBtn" class="tbtn primary" title="Export video">Export</button>
    <button id="rightToggle" class="tbtn only-mobile" title="Toggle properties">⚙</button>
  </div>
</header>

<div id="workspace">
  <aside id="left">
    <div class="tabs">
      <button class="tab active" data-tab="media">Media</button>
      <button class="tab" data-tab="storage">Storage</button>
    </div>
    <section id="tab-media" class="tabpage active">
      <div class="import-row">
        <button id="importBtn" class="btn wide">＋ Import media</button>
        <input type="file" id="fileInput" accept="video/*,audio/*,image/*" multiple hidden>
      </div>
      <div id="library" class="library">
        <div class="empty">Drop video, audio or images here<br><span>MP4 · WebM · PNG · MP3…</span></div>
      </div>
      <div id="mediaPreview" class="media-preview hidden">
        <video id="mpVideo" controls muted playsinline hidden></video>
        <audio id="mpAudio" controls hidden></audio>
        <img id="mpImg" hidden alt="">
        <div id="mpName" class="mp-name"></div>
        <div class="mp-actions">
          <button id="mpAdd" class="btn">＋ Timeline</button>
          <button id="mpOverlay" class="btn" hidden>＋ Overlay</button>
        </div>
      </div>
    </section>
    <section id="tab-storage" class="tabpage">
      <div id="storageInfo" class="storage-info"></div>
      <div class="storage-btns">
        <button id="clearTemp" class="btn danger">Clear temp videos</button>
        <button id="clearAll" class="btn danger">Clear all cached media</button>
      </div>
    </section>
  </aside>

  <main id="center">
    <div id="stage">
      <canvas id="view" width="1280" height="720"></canvas>
      <div id="stageHint" class="stage-hint">Import media, then press ▶ — or drop files anywhere</div>
    </div>
    <div id="transport">
      <button id="playBtn" class="tbtn big" title="Play / pause (Space)">▶</button>
      <span id="timeCur" class="time">0:00.0</span>
      <input type="range" id="seek" min="0" max="10" step="0.01" value="0" title="Seek">
      <span id="timeDur" class="time">0:00.0</span>
      <span class="vol-wrap" title="Preview volume"><input type="range" id="vol" min="0" max="1" step="0.01" value="1"></span>
      <button id="fsBtn" class="tbtn" title="Fullscreen preview">⛶</button>
    </div>
  </main>

  <aside id="right">
    <div id="panel"></div>
  </aside>
</div>

<div id="timeline-wrap">
  <div id="tl-toolbar">
    <div class="tb-group">
      <button id="tlZoomOut" class="tbtn" title="Zoom out">−</button>
      <span id="zoomLabel" class="time">60 px/s</span>
      <button id="tlZoomIn" class="tbtn" title="Zoom in">＋</button>
    </div>
    <div class="tb-group">
      <button id="splitBtn" class="tbtn" title="Split at playhead (S)">✂ Split</button>
      <button id="dupBtn" class="tbtn" title="Duplicate (Ctrl+D)">⧉ Duplicate</button>
      <button id="delBtn" class="tbtn danger" title="Delete (Del)">🗑 Delete</button>
    </div>
  </div>
  <div id="tlScroll">
    <div id="tlInner">
      <canvas id="ruler" height="26"></canvas>
      <div id="kfLane"></div>
      <div id="tracks"></div>
      <div id="playhead"></div>
    </div>
  </div>
</div>

<div id="exportModal" class="modal hidden">
  <div class="modal-card">
    <h2>Export video</h2>
    <div class="form-row"><label>Resolution</label>
      <select id="expRes">
        <option value="original">Original</option>
        <option value="1080">1080p</option>
        <option value="720">720p</option>
        <option value="480">480p</option>
        <option value="360">360p</option>
        <option value="240">240p</option>
      </select>
    </div>
    <div class="form-row"><label>FPS</label>
      <select id="expFps"><option>24</option><option selected>30</option><option>60</option></select>
    </div>
    <div class="form-row"><label>Quality</label>
      <select id="expQ"><option value="2">Low</option><option value="6" selected>Medium</option><option value="12">High</option></select>
    </div>
    <div class="form-row"><label>Audio</label><input type="checkbox" id="expAudio" checked></div>
    <div id="expProgressWrap" class="hidden">
      <div class="progress"><div id="expBar"></div></div>
      <div id="expStatus" class="muted">Rendering in real time — keep this tab focused…</div>
    </div>
    <div class="modal-btns">
      <button id="expCancel" class="btn">Cancel</button>
      <button id="doExport" class="btn primary">Start export</button>
    </div>
  </div>
</div>

<div id="projectsModal" class="modal hidden">
  <div class="modal-card">
    <h2>Projects</h2>
    <div id="projList" class="proj-list"></div>
    <div class="modal-btns"><button id="projClose" class="btn">Close</button></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
